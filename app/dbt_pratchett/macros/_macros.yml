version: 2

macros:
  - name: clean_whitespace
    description: >
      Collapses runs of whitespace to single spaces and
      column. Generic — reusable on any free-text field.
      series strings, comments, and post text across the staging models.
    arguments:
      - name: column_name
        type: string
        description: The column (or SQL expression) to c

  - name: strip_footnotes
    description: >
      Removes Wikipedia-style bracketed footnote markers
      Narrower than clean_whitespace and applied only to
      field, since footnote markers are a scrape artifact specific to that source.
    arguments:
      - name: column_name
        type: string
        description: The column (or SQL expression) to strip footnote markers from.

  - name: incremental_lookback
