name: Ingest Bluesky posts

# Manual trigger only (a button in the Actions tab) — never on a schedule.
# You decide when the live dataset grows; the script itself is append-only
# and checkpoints on MAX(created_at) in BigQuery, so re-running is safe.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Write service-account key
        env:
          BIGQUERY_SA_KEY: ${{ secrets.BIGQUERY_SA_KEY }}
        run: printf '%s' "$BIGQUERY_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Fetch new posts into raw.bluesky_posts
        working-directory: app
        run: python ingestion/fetch_bluesky_posts.py
